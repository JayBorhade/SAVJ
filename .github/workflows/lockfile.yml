name: Generate frontend lockfile

on:
  push:
    branches:
      - "security/**"
    paths:
      - "package.json"
      - ".github/workflows/lockfile.yml"

permissions:
  contents: write

concurrency:
  group: savj-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether lockfile is missing
        id: lockfile-state
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate deterministic npm lockfile without running package scripts
        if: ${{ steps.lockfile-state.outputs.missing == 'true' }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile resolves and audit dependencies
        if: ${{ steps.lockfile-state.outputs.missing == 'true' }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Commit lockfile if missing
        if: ${{ steps.lockfile-state.outputs.missing == 'true' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::npm did not create package-lock.json"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: commit reproducible npm dependency lockfile"
          fi
          # Other fixes may land while npm resolves dependencies. Rebase the
          # generated lockfile commit onto the latest branch, then resolve and
          # audit once more before pushing.
          git fetch origin "${BRANCH_NAME}"
          git rebase "origin/${BRANCH_NAME}"
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          git add package-lock.json
          git commit --amend --no-edit
          git push origin "HEAD:${BRANCH_NAME}"
