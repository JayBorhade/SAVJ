name: SAVJ CI

on:
  push:
    branches: [main, phase-1/stabilize-and-flows, phase-2/domain-and-validation, phase-3/backend-database, phase-4/frontend-api-integration, phase-5/live-community-messaging, phase-6/secure-proof-uploads, phase-7/migrations-and-runtime-hardening, phase-8/geospatial-discovery, phase-9/live-impact-profile, phase-10/proof-review-and-release-tests]
  pull_request:
    branches: [main, phase-1/stabilize-and-flows, phase-2/domain-and-validation, phase-3/backend-database, phase-4/frontend-api-integration]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run automated domain tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify database migration bootstrap
        env:
          DATABASE_URL: sqlite:///./migration-check.db
          JWT_SECRET: test-secret-that-is-long-enough-for-local-tests
          APP_ENV: test
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run API tests
        run: python -m pytest tests -q
