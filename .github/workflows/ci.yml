name: SAVJ CI

on:
  push:
    branches:
      - main
      - "phase-*"
      - "phase-*/**"
  pull_request:
    branches:
      - main
      - "phase-*"
      - "phase-*/**"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run automated domain tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d savj_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify database migration bootstrap
        env:
          DATABASE_URL: sqlite:///./migration-check.db
          JWT_SECRET: test-secret-that-is-long-enough-for-local-tests
          APP_ENV: test
        run: python -m alembic -c alembic.ini upgrade head
      - name: Verify PostgreSQL migration chain
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/savj_test
          JWT_SECRET: test-secret-that-is-long-enough-for-local-tests
          APP_ENV: test
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run PostgreSQL-backed API smoke test
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/savj_test
          JWT_SECRET: test-secret-that-is-long-enough-for-local-tests
          APP_ENV: test
          SAVJ_UPLOAD_DIR: ${{ runner.temp }}/savj-private-uploads
        run: python scripts/postgres_smoke.py
      - name: Run API tests
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-that-is-long-enough-for-local-tests
        run: python -m pytest tests -q

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t savj-frontend:ci .
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t savj-backend:ci .
