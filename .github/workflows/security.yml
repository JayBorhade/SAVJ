name: Security checks

on:
  push:
    branches: [main, "phase-*", "phase-*/**", "security/**"]
  pull_request:
    branches: [main, "phase-*", "phase-*/**"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Audit frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm audit --audit-level=high
          else
            echo "::warning::No package-lock.json is committed; frontend dependency audit is not reproducible yet."
            npm install --package-lock-only --ignore-scripts
            npm audit --audit-level=high
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
