# Local Compose defaults. For production, set APP_ENV=production and CORS_ORIGINS to explicit HTTPS origins.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: savj
      POSTGRES_USER: savj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
    volumes:
      - savj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savj -d savj"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://savj:${POSTGRES_PASSWORD}@db:5432/savj
      JWT_SECRET: ${JWT_SECRET:?Set a strong unique JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      SAVJ_UPLOAD_DIR: /data/private_uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - savj_private_uploads:/data/private_uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  savj_postgres:
  savj_private_uploads:
